<!DOCTYPE html>
<html>
    <head>
        <title>Student Profile</title>

        <!-- 1. External CSS Link -->
        <link rel="stylesheet" href="task1.css">

        <!-- 2. Internal CSS -->
        <style>
            h1 {
                color: blue;
                font-size: 32px;
                text-align: center;
                background-color: yellow;
            }

            .student-id {
                color: purple;
                font-size: 18px;
            }

            .description {
                color: darkblue;
                font-size: 16px;
                text-align: justify;
                background-color: lightpink;
            }
        </style>
    </head>
    <body>

        <h1>Student Profile</h1>

        <!-- 3. Inline CSS applied to Student Name -->
        <h2 style="color: red; font-size: 22px; text-align: center;">
            Student Name: Pratikshya Shrestha
        </h2>

        <!-- Internal CSS applied to Student ID -->
        <p class="student-id">
            Student ID: 10123
        </p>

        <!-- External CSS applied to Programme (from task1.css) -->
        <p class="programme">
            Programme: BSc (Hons) Software Engineering
        </p>

        <!-- Internal CSS applied to Short description -->
        <p class="description">
            Short Description: Hello! I am a student studying software engineering at PCPS College. 
            I am currently learning basic HTML and CSS to create simple web pages.
        </p>

    </body>
</html>
