<!DOCTYPE html>
<html>
    <head>
        <title>Task 2</title>
        <style>
            /* Common properties using div element selector */
            div {
                border: 2px solid black;
                padding: 20px;
                margin: 20px;
                height: 100px;
                width: 250px;
                background-color: lightblue;
            }

            /* Class selector for second div */
            .second {
                background-color: lightgreen;
                color: darkgreen;
                font-size: 20px;
            }

            /* ID selector for third div */
            #third {
                background-color: lightpink;
                color: purple;
                text-align: center;
                font-weight: bold;
            }
        </style>
    </head>
    <body>

        <h1>Task 2: Three Divs</h1>

        <!-- First div: uses only common div element selector -->
        <div>
            This is the first div.
        </div>

        <!-- Second div: uses class selector -->
        <div class="second">
            This is the second div with class selector.
        </div>

        <!-- Third div: uses id selector -->
        <div id="third">
            This is the third div with id selector.
        </div>

    </body>
</html>
